# azure-pipelines.yml
trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  # ---- Cloudsmith settings ----
  CS_WORKSPACE: 'globex-innovations'
  CS_REPO: 'acme-nonprod'
  CS_SERVICE_SLUG: 'ci_acme_service'   # Cloudsmith service account slug

steps:
- checkout: self

# ===== Cloudsmith: install standalone CLI + authenticate via native ADO OIDC =====
- task: CloudsmithCliSetupAndAuthenticate@2
  displayName: "Cloudsmith: Set up CLI and authenticate via OIDC"
  inputs:
    authMethod: oidc
    oidcNamespace: '$(CS_WORKSPACE)'
    oidcServiceSlug: '$(CS_SERVICE_SLUG)'
    exportAuthToken: true     # exports CLOUDSMITH_API_KEY + CLOUDSMITH_USERNAME (CLI 1.21.0+)
    verifyAuth: true          # optional: fail early if auth is misconfigured
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)

# ===== Python: install deps from Cloudsmith =====
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
  displayName: "Use Python 3.12"

- bash: |
    set -eo pipefail
    python -m pip install --upgrade pip
    pip install -r requirements.txt \
      --index-url "https://${CLOUDSMITH_USERNAME}:${CLOUDSMITH_API_KEY}@dl.cloudsmith.io/basic/${CS_WORKSPACE}/${CS_REPO}/python/simple/"
  displayName: "pip install from Cloudsmith"
  env:
    CS_WORKSPACE: $(CS_WORKSPACE)
    CS_REPO: $(CS_REPO)
    CLOUDSMITH_USERNAME: $(CLOUDSMITH_USERNAME)
    CLOUDSMITH_API_KEY: $(CLOUDSMITH_API_KEY)   # set by the Cloudsmith task above
