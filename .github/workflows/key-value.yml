name: Release evidence demo (uv + Cloudsmith)

on:
  push:          { branches: ["main"] }
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  CS_ORG:   globex-innovations
  CS_REPO:  meridian
  SERVICE:  gha-service
  RELEASE:  "2026.1"
  PRODUCT:  meridian-planner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }

    - name: Cloudsmith OIDC login
      uses: cloudsmith-io/cloudsmith-cli-action@v1.0.2
      with:
        oidc-namespace:    ${{ env.CS_ORG }}
        oidc-service-slug: ${{ env.SERVICE }}
        oidc-auth-only:    "true"

    - name: Install uv and latest Cloudsmith CLI
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade uv cloudsmith-cli
        cloudsmith --version

    - name: Resolve boto3 through Cloudsmith
      run: |
        echo "UV_INDEX_URL=https://token:${CLOUDSMITH_API_KEY}@dl.cloudsmith.io/basic/${CS_ORG}/${CS_REPO}/python/simple/" >> $GITHUB_ENV
        uv pip install --system -vv boto3

    - name: Build installer
      run: |
        echo "Meridian Planner ${RELEASE}" > planner.txt
        zip -q Meridian-Planner-${RELEASE}.msi planner.txt

    - name: Build SBOM
      run: |
        echo '{"bomFormat":"CycloneDX","specVersion":"1.5","version":1,' > sbom.cdx.json
        echo '"metadata":{"component":{"type":"application","name":"'${PRODUCT}'","version":"'${RELEASE}'"}},' >> sbom.cdx.json
        echo '"components":[' >> sbom.cdx.json
        echo '{"type":"library","name":"boost","version":"1.86.0","purl":"pkg:conan/boost@1.86.0"},' >> sbom.cdx.json
        echo '{"type":"library","name":"eigen","version":"3.4.0","purl":"pkg:conan/eigen@3.4.0"},' >> sbom.cdx.json
        echo '{"type":"library","name":"qt","version":"6.7.3","purl":"pkg:conan/qt@6.7.3"},' >> sbom.cdx.json
        echo '{"type":"library","name":"itk","version":"5.4.0","purl":"pkg:conan/itk@5.4.0"}' >> sbom.cdx.json
        echo ']}' >> sbom.cdx.json
        echo "SBOM_SHA=$(sha256sum sbom.cdx.json | cut -d' ' -f1)" >> $GITHUB_ENV

    - name: Build log
      run: |
        echo "build: ${PRODUCT} ${RELEASE}" > build.log
        echo "commit: ${GITHUB_SHA}" >> build.log
        echo "unit tests: pass" >> build.log
        echo "static analysis: pass" >> build.log
        echo "sbom: generated (cyclonedx 1.5)" >> build.log

    - name: Write release metadata
      run: |
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "{" > release.json
        echo "\"release_id\": \"${RELEASE}\"," >> release.json
        echo "\"product\": \"${PRODUCT}\"," >> release.json
        echo "\"git_sha\": \"${GITHUB_SHA}\"," >> release.json
        echo "\"ci_run_url\": \"${RUN_URL}\"," >> release.json
        echo "\"quality_gate\": \"passed\"," >> release.json
        echo "\"sbom_sha256\": \"${SBOM_SHA}\"," >> release.json
        echo "\"built_by\": \"github-actions\"" >> release.json
        echo "}" >> release.json
        cat release.json

    - name: Push installer
      run: |
        cloudsmith push raw ${CS_ORG}/${CS_REPO} Meridian-Planner-${RELEASE}.msi \
          --name ${PRODUCT}-installer --version ${RELEASE} \
          --metadata-content-file release.json \
          --metadata-content-type application/json \
          --metadata-source-identity "ci:github:${GITHUB_RUN_ID}"

    - name: Push SBOM
      run: |
        cloudsmith push raw ${CS_ORG}/${CS_REPO} sbom.cdx.json \
          --name ${PRODUCT}-sbom --version ${RELEASE} \
          --metadata-content-file release.json \
          --metadata-content-type application/json \
          --metadata-source-identity "ci:github:${GITHUB_RUN_ID}"

    - name: Push build log
      run: |
        cloudsmith push raw ${CS_ORG}/${CS_REPO} build.log \
          --name ${PRODUCT}-buildlog --version ${RELEASE} \
          --metadata-content-file release.json \
          --metadata-content-type application/json \
          --metadata-source-identity "ci:github:${GITHUB_RUN_ID}"

    - name: List everything in this release
      run: |
        cloudsmith list packages ${CS_ORG}/${CS_REPO} --query "metadata:release_id:${RELEASE}"
