name: Release evidence demo (uv + Cloudsmith)

on:
  push:          { branches: ["main"] }
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write               # needed for Cloudsmith OIDC

env:
  CS_ORG:   globex-innovations
  CS_REPO:  meridian
  SERVICE:  gha-service         # Cloudsmith service account
  RELEASE:  "2026.1"
  PRODUCT:  meridian-planner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }

    # 1. OIDC login – populates $CLOUDSMITH_API_KEY
    - name: Cloudsmith OIDC login
      uses: cloudsmith-io/cloudsmith-cli-action@v1.0.2
      with:
        oidc-namespace:    ${{ env.CS_ORG }}
        oidc-service-slug: ${{ env.SERVICE }}
        oidc-auth-only:    "true"

    # 2. Tooling – make sure the CLI is new enough for --metadata-* flags
    - name: Install uv and latest Cloudsmith CLI
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade uv cloudsmith-cli
        cloudsmith --version

    # 3. Cooldown moment – resolves to newest boto3 outside the window
    - name: Resolve boto3 through Cloudsmith
      run: |
        echo "UV_INDEX_URL=https://token:${CLOUDSMITH_API_KEY}@dl.cloudsmith.io/basic/${CS_ORG}/${CS_REPO}/python/simple/" >> $GITHUB_ENV
        uv pip install --system -vv boto3

    # 4. "Build" the installer and its evidence
    - name: Build installer, SBOM and build log
