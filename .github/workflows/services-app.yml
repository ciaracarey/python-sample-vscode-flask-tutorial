name: Cloudsmith custom 403 test (npm vs pnpm)

on:
  push:          { branches: ["main"] }
  pull_request:  { branches: ["main"] }
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write               # needed for Cloudsmith OIDC

env:
  CS_ORG:   globex-innovations
  CS_REPO:  services
  SERVICE:  gha-service          # Cloudsmith service-account
  # minimist 1.2.5: CVE-2021-44906, prototype pollution, CVSS 9.8, fixed in 1.2.6
  TEST_PKG: minimist@1.2.5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 1. OIDC login – populates $CLOUDSMITH_API_KEY
    - name: Cloudsmith OIDC login
      uses: cloudsmith-io/cloudsmith-cli-action@v1.0.2
      with:
        oidc-namespace:    ${{ env.CS_ORG }}
        oidc-service-slug: ${{ env.SERVICE }}
        oidc-auth-only:    "true"

    # 2. Node + pnpm setup (no package-manager cache, so every fetch hits Cloudsmith)
    - uses: actions/setup-node@v4
      with:
        node-version: "24"

    - uses: pnpm/action-setup@v4
      with:
        version: 10

    # 3. Point npm and pnpm at Cloudsmith (both read ~/.npmrc)
    - name: Configure registry for Cloudsmith
      run: |
        cat > ~/.npmrc <<EOF
        registry=https://npm.cloudsmith.io/${{ env.CS_ORG }}/${{ env.CS_REPO }}/
        //npm.cloudsmith.io/${{ env.CS_ORG }}/${{ env.CS_REPO }}/:_authToken=${CLOUDSMITH_API_KEY}
        EOF

    # 4. Baseline: npm, which should show the custom message
    - name: npm install (baseline)
      continue-on-error: true
      run: |
        mkdir -p /tmp/npm-test && cd /tmp/npm-test
        npm init -y > /dev/null
        npm install "$TEST_PKG" --verbose

    # 5. pnpm with default output: what a developer would actually see
    - name: pnpm add (default output)
      continue-on-error: true
      run: |
        mkdir -p /tmp/pnpm-test && cd /tmp/pnpm-test
        pnpm init > /dev/null
        pnpm add "$TEST_PKG"

    # 6. pnpm with debug logging: shows whether the response body reaches the client at all
    - name: pnpm add (debug output)
      continue-on-error: true
      run: |
        mkdir -p /tmp/pnpm-debug && cd /tmp/pnpm-debug
        pnpm init > /dev/null
        pnpm add "$TEST_PKG" --loglevel debug --reporter=append-only
