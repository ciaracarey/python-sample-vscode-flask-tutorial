name: Release evidence demo (uv + Cloudsmith)

on:
  push:          { branches: ["main"] }
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write               # needed for Cloudsmith OIDC

env:
  CS_ORG:   globex-innovations
  CS_REPO:  meridian-dev
  SERVICE:  gha-service         # Cloudsmith service account
  RELEASE:  "2026.1"
  PRODUCT:  meridian-planner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }

    # 1. OIDC login – populates $CLOUDSMITH_API_KEY
    - name: Cloudsmith OIDC login
      uses: cloudsmith-io/cloudsmith-cli-action@v1.0.2
      with:
        oidc-namespace:    ${{ env.CS_ORG }}
        oidc-service-slug: ${{ env.SERVICE }}
        oidc-auth-only:    "true"

    # 2. Tooling – make sure the CLI is new enough for --metadata-* flags
    - name: Install uv and latest Cloudsmith CLI
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade uv cloudsmith-cli
        cloudsmith --version

    # 3. Cooldown moment – resolves to newest boto3 outside the window
    - name: Resolve boto3 through Cloudsmith
      run: |
        echo "UV_INDEX_URL=https://token:${CLOUDSMITH_API_KEY}@dl.cloudsmith.io/basic/${CS_ORG}/${CS_REPO}/python/simple/" >> $GITHUB_ENV
        uv pip install --system -vv boto3

    # 4. "Build" the installer and its evidence
    - name: Build installer, SBOM and build log
      run: |
        echo "Meridian Planner ${RELEASE}" > planner.txt
        zip -q Meridian-Planner-${RELEASE}.msi planner.txt

        cat > sbom.cdx.json <<EOF
        {
          "bomFormat": "CycloneDX",
          "specVersion": "1.5",
          "version": 1,
          "metadata": {
            "component": { "type": "application", "name": "${PRODUCT}", "version": "${RELEASE}" }
          },
          "components": [
            { "type": "library", "name": "boost",  "version": "1.86.0", "purl": "pkg:conan/boost@1.86.0" },
            { "type": "library", "name": "eigen",  "version": "3.4.0",  "purl": "pkg:conan/eigen@3.4.0" },
            { "type": "library", "name": "qt",     "version": "6.7.3",  "purl": "pkg:conan/qt@6.7.3" },
            { "type": "library", "name": "itk",    "version": "5.4.0",  "purl": "pkg:conan/itk@5.4.0" }
          ]
        }
        EOF

        cat > build.log <<EOF
        build:          ${PRODUCT} ${RELEASE}
        commit:         ${GITHUB_SHA}
        unit tests:     pass
        static analysis: pass
        sbom:           generated (cyclonedx 1.5)
        EOF

        echo "SBOM_SHA=$(sha256sum sbom.cdx.json | cut -d' ' -f1)" >> $GITHUB_ENV

    # 5. Release metadata shared by every artifact in this release
    - name: Write release metadata
      run: |
        cat > release.json <<EOF
        {
          "release_id":   "${RELEASE}",
          "product":      "${PRODUCT}",
          "git_sha":      "${GITHUB_SHA}",
          "ci_run_url":   "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          "quality_gate": "passed",
          "sbom_sha256":  "${SBOM_SHA}",
          "built_by":     "github-actions"
        }
        EOF
        cat release.json

    # 6. Push the installer with evidence attached (push aborts if metadata is invalid)
    - name: Push installer with release metadata
      run: |
        cloudsmith push raw ${CS_ORG}/${CS_REPO} Meridian-Planner-${RELEASE}.msi \
          --name