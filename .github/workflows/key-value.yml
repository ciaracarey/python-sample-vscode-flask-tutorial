name: Release evidence demo (uv + Cloudsmith)

on:
  push:          { branches: ["main"] }
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  CS_ORG:   globex-innovations
  CS_REPO:  meridian
  SERVICE:  gha-service
  RELEASE:  "2026.1"
  PRODUCT:  meridian-planner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }

    - name: Cloudsmith OIDC login
      uses: cloudsmith-io/cloudsmith-cli-action@v1.0.2
      with:
        oidc-namespace:    ${{ env.CS_ORG }}
        oidc-service-slug: ${{ env.SERVICE }}
        oidc-auth-only:    "true"

    - name: Install uv and latest Cloudsmith CLI
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade uv cloudsmith-cli
        cloudsmith --version

    - name: Resolve boto3 through Cloudsmith
      run: |
        echo "UV_INDEX_URL=https://token:${CLOUDSMITH_API_KEY}@dl.cloudsmith.io/basic/${CS_ORG}/${CS_REPO}/python/simple/" >> $GITHUB_ENV
        uv pip install --system -vv boto3

    - name: Build installer, SBOM and build log
      run: |
        echo "Meridian Planner ${RELEASE}" > planner.txt
        zip -q Meridian-Planner-${RELEASE}.msi planner.txt
        echo '{"bomFormat":"CycloneDX","specVersion":"1.5","version":1,"metadata":{"component":{"type":"application","name":"'${PRODUCT}'","version":"'${RELEASE}'"}},"components":[{"type":"library","name":"boost","version":"1.86.0","purl":"pkg:conan/boost@1.86.0"},{"type":"library","name":"eigen","version":"3.4.0","purl":"pkg:conan/eigen@3.4.0"},{"type":"library","name":"qt","version":"6.7.3","purl":"pkg:conan/qt@6.7.3"},{"type":"library","name":"itk","version":"5.4.0","purl":"pkg:conan/itk@5.4.0"}]}' > sbom.cdx.json
        printf 'build: %s %s\ncommit: %s\nunit tests: pass\nstatic analysis: pass\nsbom: generated (cyclonedx 1.5)\n' "${PRODUCT}" "${RELEASE}"
